<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe EPOS - Kasir & Manajemen Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen flex flex-col">
  <header class="bg-stone-800 border-b border-stone-700 p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-wide text-amber-500">☕ BrewHaven EPOS</h1>
    <span class="text-sm text-stone-400">Sistem Kasir Cafe</span>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Daftar Menu -->
    <div class="md:col-span-2 space-y-4">
      <div class="flex justify-between items-center bg-stone-800 p-4 rounded-xl border border-stone-700">
        <h2 class="font-semibold text-lg">Daftar Menu</h2>
        <!-- Form Tambah Menu Cepat -->
        <form id="menu-form" class="flex gap-2">
          <input type="text" id="menu-name" placeholder="Nama Menu" required class="p-1.5 bg-stone-700 border border-stone-600 rounded text-sm w-32">
          <input type="number" id="menu-price" placeholder="Harga" required class="p-1.5 bg-stone-700 border border-stone-600 rounded text-sm w-24">
          <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded text-sm font-medium transition">+ Menu</button>
        </form>
      </div>
      
      <div id="menu-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
        <!-- Item menu dimuat dinamis -->
      </div>
    </div>

    <!-- Keranjang & Kasir -->
    <div class="bg-stone-800 p-4 rounded-xl border border-stone-700 flex flex-col justify-between space-y-4 shadow-lg">
      <div>
        <h2 class="font-semibold text-lg mb-3 border-b border-stone-700 pb-2">Pesanan Aktif</h2>
        <div class="mb-3">
          <label class="block text-xs text-stone-400 mb-1">Nama Pelanggan</label>
          <input type="text" id="customer-name" placeholder="Nama Pemesan" class="w-full p-2 bg-stone-700 border border-stone-600 rounded text-sm">
        </div>
        <div id="cart-items" class="space-y-2 max-h-60 overflow-y-auto pr-1">
          <p class="text-sm text-stone-500 text-center py-4">Keranjang masih kosong</p>
        </div>
      </div>

      <div class="border-t border-stone-700 pt-4 space-y-3">
        <div class="flex justify-between text-lg font-bold">
          <span>Total:</span>
          <span id="cart-total" class="text-amber-500">Rp 0</span>
        </div>
        <button onclick="checkout()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition shadow">Bayar & Proses Pesanan</button>
      </div>
    </div>
  </main>

  <script>
    let menuData = [];
    let cart = [];

    async function fetchMenu() {
      const res = await fetch('/api/menu');
      menuData = await res.json();
      renderMenu();
    }

    function renderMenu() {
      const grid = document.getElementById('menu-grid');
      if (menuData.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-stone-500 text-center py-6">Belum ada menu tersedia. Tambahkan melalui form di atas.</p>';
        return;
      }
      grid.innerHTML = menuData.map(item => `
        <div onclick='addToCart(${JSON.stringify(item)})' class="bg-stone-800/80 border border-stone-700 hover:border-amber-500 cursor-pointer p-4 rounded-xl flex flex-col justify-between transition group">
          <div>
            <h3 class="font-medium group-hover:text-amber-400 transition">${item.name}</h3>
            <span class="text-xs text-stone-400 bg-stone-700 px-2 py-0.5 rounded inline-block mt-1">${item.category}</span>
          </div>
          <p class="text-emerald-400 font-semibold mt-4">Rp ${item.price.toLocaleString('id-ID')}</p>
        </div>
      `).join('');
    }

    function addToCart(item) {
      const existing = cart.find(i => i.id === item.id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...item, qty: 1 });
      }
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      if (cart.length === 0) {
        container.innerHTML = '<p class="text-sm text-stone-500 text-center py-4">Keranjang masih kosong</p>';
        document.getElementById('cart-total').innerText = 'Rp 0';
        return;
      }

      container.innerHTML = cart.map((item, index) => `
        <div class="flex justify-between items-center bg-stone-700/50 p-2.5 rounded border border-stone-600 text-sm">
          <div>
            <p class="font-medium">${item.name}</p>
            <p class="text-xs text-stone-400">Rp ${item.price.toLocaleString('id-ID')} x ${item.qty}</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-semibold">Rp ${(item.price * item.qty).toLocaleString('id-ID')}</span>
            <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-300 px-1.5 font-bold">×</button>
          </div>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('cart-total').innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    document.getElementById('menu-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('menu-name').value;
      const price = document.getElementById('menu-price').value;

      await fetch('/api/menu', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, category: 'Minuman/Makanan' })
      });

      e.target.reset();
      fetchMenu();
    });

    async function checkout() {
      if (cart.length === 0) return alert('Keranjang masih kosong!');
      const customerName = document.getElementById('customer-name').value;
      const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: cart, totalAmount, customerName })
      });

      if (res.ok) {
        alert('Transaksi berhasil disimpan ke database!');
        cart = [];
        document.getElementById('customer-name').value = '';
        renderCart();
      } else {
        alert('Gagal memproses pesanan.');
      }
    }

    fetchMenu();
  </script>
</body>
</html>
